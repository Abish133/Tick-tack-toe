services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: elemental_arena
      MYSQL_USER: elemental_arena
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env.docker}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.docker}
    volumes:
      - arena_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [arena]
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DATABASE_URL: mysql://elemental_arena:${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env.docker}@mysql:3306/elemental_arena
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.docker}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    networks: [arena]
volumes:
  arena_mysql:
networks:
  arena:
