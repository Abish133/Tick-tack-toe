name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/android.yml', 'docs/ANDROID.md']
  pull_request:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/android.yml', 'docs/ANDROID.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Android APK build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELEMENTAL_GAME_ORIGIN: ${{ vars.ELEMENTAL_GAME_ORIGIN || 'https://elemental-arena-production.up.railway.app' }}
      ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID || 'ca-app-pub-3940256099942544~3347511713' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify the official Gradle wrapper
        run: |
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  mobile/android/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check -
          chmod +x mobile/android/gradlew
      - name: Install the Android platform through Google's SDK manager
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Compile and lint the real Android application
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - name: Hash the APK
        working-directory: mobile/android
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: elemental-arena-android-debug
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
